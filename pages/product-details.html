<html lang="en">


<head>

<body>


<header>

<nav class="navbar">

<a class="logo" href="index.html">
Fashion Store
</a>


</nav>

</header>





<section class="details-container">


<div class="gallery">


<img 
id="mainImage">



<div class="thumbs">

<img src="">
<img src="">
<img src="">

</div>


</div>





<div class="details">


<h1 id="productName">

</h1>



<p id="brand">

</p>



<div class="rating">

⭐⭐⭐⭐⭐

</div>


<h2>

₹<span id="offerPrice"></span>

</h2>


<p class="old-price">

</p>




<h3>
Select Size
</h3>


<div class="sizes">

<button>
S

<button>
M
</button>

<button>

</button>

<button>

Select Color
</h3>


<div class="colors">


<button class="black"></button>

<button class="white"></button>

<button class="blue"></button>


</div>



<button onclick="changeQuantity('minus')">
-
</button>

<span id="quantity">
1
</span>

<button onclick="changeQuantity('plus')">
+
</button>



<button 
class="cart-btn"
onclick="addToCart()">
Add To Cart
</button>


<button 
class="buy-btn"
onclick="buyNow()">
Buy Now
</button>

<section class="description-box">
